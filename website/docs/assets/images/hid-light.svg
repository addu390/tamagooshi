<svg xmlns="http://www.w3.org/2000/svg" width="920" height="354" viewBox="0 0 920 354" role="img" aria-label="HID mode: hub on the laptop sets gamepad, desk, or off on the device">
  <style>
    :root {
      --ink: #18181b;
      --soft: #18181b;
      --muted: #52525b;
      --text: #18181b;
      --border: #18181b;
      --strong: #18181b;
      --panel: none;
      --fill: rgba(24, 24, 27, 0.04);
      --hole: none;
      --sg: #9aa0a8;
      --sg-deep: #7a8088;
      --scr: #2c3036;
      --accent: #0e9f6e;
      --on-accent: #ffffff;
    }
    text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    rect, path, line, circle, polyline, polygon { stroke-width: 0.85; }
    .cap { font-size: 13px; fill: var(--text); }
    .lbl { font-size: 11px; fill: var(--text); }
    .note { font-size: 10px; fill: var(--text); }
    .side { font-size: 10px; fill: var(--text); }
    .row { font-size: 10px; fill: var(--text); }
    .chip { font-size: 9px; letter-spacing: .07em; fill: var(--text); text-transform: uppercase; }
    .sideh { font-size: 9px; letter-spacing: .06em; fill: var(--text); }
    .cta { font-size: 9px; fill: var(--on-accent); }
    .panel { fill: var(--panel); stroke: var(--border); }
    .bar-t { fill: var(--fill); stroke: none; }
    .bar { fill: #d4d4d8; }
    .box { fill: var(--hole); stroke: var(--border); }
    .line { stroke: var(--strong); fill: none; }
    .dash { stroke: var(--muted); fill: none; stroke-dasharray: 3 2; }
    .grid { stroke: #d4d4d8; }
    .dot { fill: var(--text); }
    .scr { fill: #18181b; stroke: var(--border); }
    .px { fill: #e4e4e7; }
    .btn { fill: color-mix(in srgb, var(--accent) 74%, #fff); stroke: var(--border); }
    .ok { fill: color-mix(in srgb, var(--accent) 88%, #fff); }
    .pill { fill: color-mix(in srgb, var(--accent) 88%, #fff); }
    .dimchip { fill: rgba(24, 24, 27, 0.08); stroke: rgba(24, 24, 27, 0.22); }
    .live { fill: none; stroke: var(--border); }
    .laptop { fill: var(--sg); stroke: var(--border); }
    .laptop-base { fill: var(--sg-deep); stroke: var(--border); }
    .laptop-edge { fill: #5c626a; stroke: var(--border); }
    .laptop-scr { fill: var(--scr); stroke: var(--border); }
    .cam { fill: #0b0d10; stroke: none; }
    .key { fill: rgba(11, 13, 16, 0.30); stroke: none; }
    .touchpad { fill: rgba(11, 13, 16, 0.16); stroke: rgba(11, 13, 16, 0.34); }
  </style>
